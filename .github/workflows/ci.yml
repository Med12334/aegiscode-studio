name: AegisCode Studio Polyglot CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  java-backend-orchestrator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Compile & Run JUnit 5 Suite (Mistake Ledger, SAST & Sandbox)
        working-directory: ./backend-orchestrator
        run: mvn clean test package

  python-ast-intelligence-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies & Run Pytest AST Suite
        working-directory: ./ai-ast-engine
        run: |
          pip install -r requirements.txt
          PYTHONPATH=. pytest -v
